name: Update RTU calendar

on:
  schedule:
    # Tous les jours à 4h UTC (~6-7h à Riga selon la saison)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python sync_calendar.py

      - name: Commit et push si le planning a changé
        run: |
          git config user.name "rtu-calendar-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add planning.ics
          git diff --cached --quiet || git commit -m "Update planning.ics"
          git push
